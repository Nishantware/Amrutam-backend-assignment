openapi: 3.0.3
info:
  title: Amrutam Telemedicine API
  version: 1.0.0
  description: REST API starter for telemedicine workflows. All timestamps are ISO-8601 UTC.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    Consultation:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        slot_id: { type: string, format: uuid }
        status: { type: string, enum: [BOOKED, IN_PROGRESS, COMPLETED, CANCELLED] }
paths:
  /auth/register:
    post:
      security: []
      summary: Register a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                fullName: { type: string, minLength: 2, maxLength: 120 }
      responses: {'201': {description: Patient created}, '400': {description: Validation error}, '409': {description: Email exists}}
  /auth/login:
    post:
      security: []
      summary: Authenticate user
      responses: {'200': {description: JWT access token}, '401': {description: Invalid credentials}}
  /doctors:
    get:
      security: []
      summary: Search verified doctors
      parameters:
        - {in: query, name: specialty, schema: {type: string}}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0}}
      responses: {'200': {description: Doctor list}}
  /doctors/{doctorId}/availability:
    get:
      security: []
      summary: List future unbooked slots
      parameters: [{in: path, name: doctorId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Available slots}}
  /doctors/availability:
    post:
      summary: Create a doctor availability slot (doctor/admin)
      responses: {'201': {description: Slot created}, '401': {description: Unauthorized}, '403': {description: Forbidden}}
  /consultations:
    get:
      summary: List consultations visible to current role
      responses: {'200': {description: Consultations}}
    post:
      summary: Book a slot; Idempotency-Key header is mandatory
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId]
              properties:
                slotId: {type: string, format: uuid}
                reason: {type: string, maxLength: 1000}
      responses: {'201': {description: Booked}, '200': {description: Idempotent replay}, '409': {description: Slot unavailable}}
  /consultations/{id}/status:
    patch:
      summary: Transition consultation status (doctor/admin)
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Updated}, '409': {description: Invalid transition}}
  /consultations/{id}/prescriptions:
    post:
      summary: Create prescription for completed consultation (doctor)
      responses: {'201': {description: Prescription created}, '409': {description: Already exists}}
