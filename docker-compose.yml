services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://amrutam:amrutam_dev_password@db:5432/amrutam
      JWT_SECRET: local-only-change-this-secret-to-a-long-random-value
      JWT_EXPIRES_IN: 15m
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amrutam
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: amrutam_dev_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam -d amrutam"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
